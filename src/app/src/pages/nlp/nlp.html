<div class="NLPAll">
    @for (space of listSpaces | async; track space.project) {
        <section class="HF-Space-Container">
            <div class="HF-Space-Container-text">
                <h2>{{ space.project }}</h2>
                @if (space.extraLinks?.length) {
                    <h4>
                        @for (link of space.extraLinks; track link.url) {
                            @if (!$first) { | }
                            <a [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.name }}</a>
                        }
                    </h4>
                }
                <p>{{ space.description }}</p>
            </div>
            <iframe
                [src]="space.safeSpace"
                [title]="space.project + ' interactive demo'"
                loading="lazy"
            ></iframe>
        </section>
    }
</div>
